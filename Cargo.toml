[package]
name = "bddkit-appium"
version = "0.4.0"
edition = "2024"
rust-version = "1.97"
description = "Native app steps for the bddkit acceptance-testing tool: Android and Windows applications through Appium"
license = "Apache-2.0"
repository = "https://github.com/bddkit/bddkit-appium"
homepage = "https://github.com/bddkit/bddkit-appium"
readme = "README.md"
keywords = ["bdd", "gherkin", "testing", "appium", "bddkit"]
categories = ["development-tools::testing"]
exclude = ["/.github", "/.idea", "/docs"]

[lib]
# rlib beside the cdylib so `tests/stub.rs` can call the exports in-process.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Blocking on purpose: the host calls every export under spawn_blocking, and a
# tokio runtime inside a cdylib that is never unloaded has no owner.
ureq = "3.4"
serde_json = "1.0"
serde_yaml_ng = "0.10"
base64 = "0.22"
url = "2"

[dev-dependencies]
axum = "0.8"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tempfile = "3"
regex = "1.13"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
clone_on_ref_ptr = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
# noise for this project
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
format_push_string = "allow"
