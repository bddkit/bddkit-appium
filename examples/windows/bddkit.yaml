# the Windows machine itself (Developer Mode on).
paths: [features]
concurrency: 1
resources:
  api: {}
  app:
    calculator:
      platform: windows
      remote_url: ${APPIUM_URL:-http://localhost:4723}
      app: Microsoft.WindowsCalculator_8wekyb3d8bbwe!App
      locators: locators.yaml
